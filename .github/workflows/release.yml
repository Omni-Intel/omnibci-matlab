name: Build and release MATLAB SDK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave blank for build only)
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            matlab: R2023a
          - platform: linux-x64
            runner: ubuntu-22.04
            matlab: R2023a
          - platform: macos-x64
            runner: macos-15-intel
            matlab: R2025a
          - platform: macos-arm64
            runner: macos-15
            matlab: R2025a
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out MATLAB SDK and private Rust SDK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          persist-credentials: false

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config

      - name: Install Apple silicon Java runtime
        if: matrix.platform == 'macos-arm64'
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check release version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $manifest = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = $manifest.packages | Where-Object { $_.name -eq 'omnibci-matlab-native' }
          if (-not $package) { throw 'MATLAB SDK package not found' }
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:REQUESTED_TAG }
          if ($releaseTag -and $releaseTag -ne "v$($package.version)") {
            throw "Tag $releaseTag does not match Cargo version $($package.version)"
          }
          "SDK_VERSION=$($package.version)" >> $env:GITHUB_ENV

      - name: Install MATLAB ${{ matrix.matlab }}
        id: matlab
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab }}

      - name: Test and build native MEX
        shell: pwsh
        env:
          MATLAB_ROOT: ${{ steps.matlab.outputs.matlabroot }}
        run: |
          if (-not (Test-Path -LiteralPath $env:MATLAB_ROOT)) { throw 'MATLAB installation not found' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --features mex -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --features mex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package MATLAB SDK
        shell: pwsh
        run: |
          python scripts/package_release.py --version $env:SDK_VERSION --platform '${{ matrix.platform }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnibci-matlab-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish four-platform release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform archives
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: actions/download-artifact@v4
        with:
          pattern: omnibci-matlab-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
            test -f "dist/omnibci-matlab-${RELEASE_TAG}-${platform}.zip"
          done
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.zip --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.zip --verify-tag \
              --title "OmniBCI MATLAB SDK ${RELEASE_TAG}" --generate-notes
          fi
